[project]
name = "agentcrew"
version = "0.1.0"
description = "AgentCrew backend sidecar: agentcrew_core (pure library) + agentcrew_server (FastAPI assembly)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=2,<3",
    "markdown-it-py>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pyyaml>=6",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
agentcrew-server = "agentcrew_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcrew_core", "agentcrew_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
