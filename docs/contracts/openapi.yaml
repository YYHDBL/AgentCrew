# AgentCrew Sidecar API（v0.3-draft——第四轮审查回稿：M0 操作具备可执行 schema）
# 维护：后端 Agent。x-phase 标注实现批次（m0 = 当前切片；p3/p4/p5 = 增量池）。
# 鉴权：除 /api/health 外全部 Bearer（AGENTCREW_TOKEN 环境变量注入，不经 stdout）。
# 信封：成功 JSON = {"data": ...}；错误 = {"error": {code, message, detail}}；
#       204 与 SSE 流不套信封。游标（from/after_seq）一律排他：返回 seq > 游标。
# SSE 帧：默认帧 = 事件信封 {global_seq, task_run_id?, seq?, type, payload, ts}；
#         控制帧 event:resync（data 含最后连续 global_seq，客户端从该游标重连）；
#         event:shutdown（优雅关闭，客户端保存游标）；event:ping 心跳。
openapi: 3.1.0
info:
  title: AgentCrew Sidecar API
  version: 0.5.0-draft
  description: |
    单用户本地 sidecar。M0 操作带完整请求/响应/错误 schema；
    M2 操作定义当前身份、资源、授权、审计和诊断边界；实施归属见 x-domain-card。
    演示身份通过服务端签发的 X-AgentCrew-Identity 标识固定于每个请求。
    p3/p5 操作 schema 随对应切片细化（当前为方向性描述）。
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port: { default: "8710" }
security:
  - bearerToken: []
  - bearerToken: []
    demoIdentity: []
tags:
  - { name: tasks, description: 任务（会话）与指令 }
  - { name: materials, description: 任务材料与访问范围（F001） }
  - { name: queue, description: 排队：暂停/继续/取消（F006） }
  - { name: approvals, description: 审批（F005） }
  - { name: questions, description: 向用户提问的回答链（v0.3 新增） }
  - { name: verifications, description: 待核验结果提交（F003） }
  - { name: artifacts, description: 产物（F004） }
  - { name: runs, description: 执行记录与事件（F002/F008） }
  - { name: settings, description: 后端运行配置 }
  - { name: memory, description: 三库、Skill、审核、账本与后台作业（M1-11 实施） }
  - { name: governance, description: 当前身份、资源、Grant、角色和权限规则（M2） }
  - { name: audit, description: 审计查询、两级验证和受控诊断恢复（M2） }
  - { name: cron, description: 定时任务（F007，phase p5） }

components:
  securitySchemes:
    bearerToken: { type: http, scheme: bearer }
    demoIdentity: { type: apiKey, in: header, name: X-AgentCrew-Identity, description: 服务端签发的演示身份标识，Bearer仍然必需 }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            detail: { type: object, additionalProperties: true }
    ConversationSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, "null"] }
        status: { type: string, enum: [active, archived] }
        agent_name: { type: string }
        last_activity_at: { type: string, format: date-time }
        state_badge: { type: string, enum: [idle, running, waiting_approval, waiting_question, interrupted, failed] }
    TaskRunSummary:
      type: object
      properties:
        id: { type: string }
        instruction: { type: string }
        status: { type: string, enum: [queued, running, waiting_user, waiting_verification, interrupted, completed, failed, cancelled] }
        current_attempt_no: { type: integer }
        cron_job_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ConversationState:
      type: object
      properties:
        state: { type: string, enum: [idle, starting, running, error] }
        waiting_approvals: { type: integer }
        waiting_questions: { type: integer }
        queue_paused: { type: boolean }
        at_global_seq: { type: integer, description: 快照反映到的全局事件位置；≤它的 global_seq 已被吸收，续播跳过（v0.3） }
        queue:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              enqueued_at: { type: string, format: date-time }
        can_send: { type: boolean }
        can_queue: { type: boolean }
        can_cancel: { type: boolean }
        can_continue_queue: { type: boolean }
        current_task_run_id: { type: [string, "null"] }
    Scope:
      type: object
      properties:
        workspace_dir: { type: string }
        materials_dir: { type: string }
        folders:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              access: { type: string, enum: [read, read_write], description: v1.7 起授权界面读写分列 }
    MaterialImportResult:
      type: object
      properties:
        original_path: { type: string }
        stored_name: { type: string }
        size_bytes: { type: integer }
        error: { type: [string, "null"] }
    ConversationCreateRequest:
      type: object
      required: [instruction]
      properties:
        workspace_id: { type: string, default: default, description: 真实登记且当前身份可访问的工作区 }
        agent_id: { type: string }
        instruction: { type: string, minLength: 1 }
        client_request_id: { type: string, description: 幂等键——网络重试不产生重复任务（v0.3） }
        import_files: { type: array, items: { type: string }, maxItems: 20 }
        folders: { type: array, items: { type: string }, maxItems: 5 }
    ConversationCreateData:
      type: object
      properties:
        conversation: { $ref: "#/components/schemas/ConversationSummary" }
        materials: { type: array, items: { $ref: "#/components/schemas/MaterialImportResult" } }
        folders:
          type: array
          description: 授权文件夹逐项结果（不存在/超限逐项报 error；C7 落地补充）
          items:
            type: object
            properties:
              path: { type: string }
              error: { type: [string, "null"] }
        scope: { $ref: "#/components/schemas/Scope" }
        task_run_id: { type: string }
    ConversationPatchRequest:
      type: object
      properties:
        title: { type: string, minLength: 1 }
    InstructionRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        client_request_id: { type: string }
    Message:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        task_run_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    QueueCancelRequest:
      type: object
      properties:
        item_ids: { type: array, items: { type: string } }
        all: { type: boolean }
    Approval:
      type: object
      properties:
        call_id: { type: string }
        tool: { type: string }
        target: { type: string }
        input_hash: { type: string }
        risk: { type: string, enum: [low, medium, high] }
        always_scope_preview: { type: [string, "null"] }
        requested_at: { type: string, format: date-time }
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [allow_once, allow_always, reject_once, reject_always] }
        input_hash: { type: string, description: 可选——与审批卡绑定的参数哈希，不一致 409 APPROVAL_STALE（v0.3.1 补） }
    QuestionPending:
      type: object
      properties:
        request_id: { type: string }
        question: { type: string }
        options: { type: array, items: { type: string } }
        asked_at: { type: string, format: date-time }
    QuestionAnswerRequest:
      type: object
      properties:
        answer: { type: [string, "null"], description: 用户的回答；null = 用户取消回答（按"拒绝回答"告知模型） }
    PendingVerification:
      type: object
      properties:
        call_id: { type: string }
        tool: { type: string }
        input: { type: object, additionalProperties: true }
        dispatched_at: { type: string, format: date-time }
        evidence: { type: string }
    VerificationRequest:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string, enum: [confirmed_executed, confirmed_not_executed] }
        note: { type: string }
    Artifact:
      type: object
      properties:
        id: { type: string }
        task_run_id: { type: string }
        tool_call_id: { type: string }
        name: { type: string }
        path: { type: string }
        ext: { type: string }
        size_bytes: { type: [integer, "null"] }
        status: { type: string, enum: [generating, ready, failed, missing] }
        created_at: { type: string, format: date-time }
    Settings:
      type: object
      properties:
        config_version: { type: string }
        memory: { $ref: "#/components/schemas/MemorySettings" }
        models:
          type: object
          properties:
            main: { $ref: "#/components/schemas/ModelSlot" }
            aux: { $ref: "#/components/schemas/ModelSlot" }
        gates:
          type: object
          properties:
            max_steps: { type: integer }
            stall_seconds: { type: integer }
            repeat_limit: { type: integer }
            global_concurrency: { type: integer }
            token_budget: { type: integer, description: 任务累计 token 硬上限（超限 RUN_FAILED(token_budget)；压缩是 M1）——C8 }
        limits:
          type: object
          properties:
            max_files: { type: integer }
            max_file_mb: { type: integer }
            max_folders: { type: integer }
    ModelSlot:
      type: object
      properties:
        provider: { type: string, enum: [glm, openai-compatible], description: glm 使用 Anthropic Messages；openai-compatible 使用 Chat Completions }
        model: { type: string }
        context_window: { type: [integer, "null"], minimum: 1 }
        context_window_source: { type: [string, "null"] }
        tokenizer_repository: { type: [string, "null"] }
        tokenizer_revision: { type: [string, "null"] }
        tokenizer_sha256: { type: [string, "null"] }
        prompt_format: { type: [string, "null"] }
        max_tokens: { type: integer, minimum: 1 }
        api_key_configured: { type: boolean }
        api_key_hint: { type: string, description: 尾 4 位 }
        effective_source: { type: string, enum: [env, file], description: v1.1：该槽当前生效来源 }
    SettingsPatchRequest:
      type: object
      properties:
        models:
          type: object
          properties:
            main: { type: object, additionalProperties: true }
            aux: { type: object, additionalProperties: true }
        api_key_clear: { type: array, items: { type: string, enum: [main, aux] }, description: 显式清除某槽密钥 }
        gates: { type: object, additionalProperties: true }
        limits: { type: object, additionalProperties: true }
        memory: { $ref: "#/components/schemas/MemorySettings" }
    SettingsPatchData:
      type: object
      properties:
        settings: { $ref: "#/components/schemas/Settings" }
        ignored_fields: { type: array, items: { type: string }, description: 被环境变量覆盖而未生效的字段 }
        restart_required:
          type: array
          items: { type: string }
          description: 需重启生效的本次触碰字段（gates.global_concurrency 在进程启动期构造信号量，PATCH 仅落盘——C8 二轮回稿）
        audit:
          type: object
          description: 审计入链状态（外审回稿：一切配置变更入审计链）
          properties:
            status: { type: string, enum: [ok, pending, failed], description: pending = 审计写失败已落待办文件待补链；failed = 待办也无法落盘 }
    MemorySettings:
      type: object
      additionalProperties: false
      properties:
        user_quota: { type: integer, minimum: 1, default: 1400 }
        workspace_quota: { type: integer, minimum: 1, default: 2200 }
        soul_quota: { type: integer, minimum: 1, default: 2700 }
        write_approval: { type: boolean, default: false }
    MemorySource:
      type: object
      additionalProperties: false
      required: [actor_type, actor_id]
      properties:
        actor_type: { type: string, enum: [user, agent, curator, system] }
        actor_id: { type: string, minLength: 1 }
        conversation_id: { type: [string, "null"] }
        task_run_id: { type: [string, "null"] }
        job_id: { type: [string, "null"] }
        manual_edit_id: { type: [string, "null"] }
    MemoryEntry:
      type: object
      required: [entry_id, entry_hash, text, state, hits, last_hit_at, created_at, source, basis, needs_review]
      properties:
        entry_id: { type: string }
        entry_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        text: { type: string }
        state: { type: string, enum: [active, stale, archived, pinned] }
        hits: { type: integer, minimum: 0 }
        last_hit_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/MemorySource" }
        basis: { type: string, minLength: 1 }
        needs_review: { type: boolean }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
    MemoryStore:
      type: object
      required: [store_type, store_id, revision, text, sha256, metadata_sha256, used_characters, quota, entries, at_global_seq]
      properties:
        store_type: { type: string, enum: [user, workspace, soul, skill] }
        store_id: { type: string }
        workspace_id: { type: [string, "null"] }
        agent_id: { type: [string, "null"] }
        revision: { type: integer, minimum: 0 }
        text: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        metadata_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        used_characters: { type: integer, minimum: 0 }
        quota: { type: [integer, "null"], minimum: 1 }
        entries: { type: array, items: { $ref: "#/components/schemas/MemoryEntry" } }
        at_global_seq: { type: integer, minimum: 0 }
        files: { type: array, items: { type: string } }
        description: { type: string, maxLength: 60 }
        name: { type: string }
    MemoryChangeRequest:
      type: object
      additionalProperties: false
      required: [change_id, expected_revision, basis]
      properties:
        change_id: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { type: integer, minimum: 0 }
        text: { type: string, minLength: 1 }
        basis: { type: string, minLength: 1 }
        conversation_id: { type: [string, "null"] }
        description: { type: string, maxLength: 60 }
        name: { type: string, minLength: 1 }
        files: { type: object, additionalProperties: { type: [string, "null"] }, description: Skill 相对路径到正文，null 删除；服务校验目录边界 }
        review_decision: { type: string, enum: [approve, reject] }
    MemoryChange:
      type: object
      required: [change_id, ledger_id, revision, global_seq, idempotent_replay]
      properties:
        change_id: { type: string }
        ledger_id: { type: integer }
        revision: { type: integer, minimum: 1 }
        global_seq: { type: integer, minimum: 1 }
        entry_id: { type: [string, "null"] }
        entry_hash: { type: [string, "null"] }
        idempotent_replay: { type: boolean }
        version_id: { type: string, description: Skill发布对应的不可变版本 }
        version_no: { type: integer, minimum: 1 }
    MemoryWriteRequest:
      allOf:
        - { $ref: "#/components/schemas/MemoryChangeRequest" }
        - { required: [text] }
    MemoryReviewRequest:
      allOf:
        - { $ref: "#/components/schemas/MemoryChangeRequest" }
        - { required: [review_decision] }
    MemoryLedger:
      type: object
      required: [id, change_id, store_type, store_id, action, before_text, after_text, before_metadata, after_metadata, source, created_at]
      properties:
        id: { type: integer }
        change_id: { type: string }
        store_type: { type: string, enum: [user, workspace, soul, skill] }
        store_id: { type: string }
        action: { type: string, enum: [create, update, archive, restore, pin, unpin, review, rollback, batch, stale] }
        before_text: { type: [string, "null"] }
        after_text: { type: [string, "null"] }
        before_metadata: { type: object, additionalProperties: true }
        after_metadata: { type: object, additionalProperties: true }
        before_files: { type: array, items: { $ref: "#/components/schemas/MemoryLedgerFile" } }
        after_files: { type: array, items: { $ref: "#/components/schemas/MemoryLedgerFile" } }
        restored_ledger_id: { type: [integer, "null"] }
        source: { $ref: "#/components/schemas/MemorySource" }
        created_at: { type: string, format: date-time }
    MemoryLedgerFile:
      type: object
      required: [path, content, sha256]
      properties:
        path: { type: string }
        content: { type: [string, "null"] }
        sha256: { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
    MemoryJob:
      type: object
      required: [id, kind, status, conversation_id, task_run_id, trigger_global_seq, model, config_version, usage, error, created_at, finished_at, approvals]
      properties:
        id: { type: string }
        kind: { type: string, enum: [summary, memory_review, skill_review, curate] }
        status: { type: string, enum: [queued, running, waiting_approval, completed, cancelled, interrupted, failed] }
        conversation_id: { type: [string, "null"] }
        task_run_id: { type: [string, "null"] }
        trigger_global_seq: { type: integer, minimum: 0 }
        model: { type: [string, "null"] }
        config_version: { type: string }
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }
        report: { type: [object, "null"], additionalProperties: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        approvals:
          type: array
          items:
            type: object
            required: [id, job_id, call_id, input_hash, tool, input, status]
            properties:
              id: { type: string }
              job_id: { type: string }
              call_id: { type: string }
              input_hash: { type: string }
              tool: { type: string, enum: [memory_write, skill_patch] }
              input: { type: object, additionalProperties: true }
              status: { type: string, enum: [pending, allowed, rejected, expired] }
        calls:
          type: array
          items:
            type: object
            required: [ordinal, type, payload, created_at]
            properties:
              ordinal: { type: integer, minimum: 1 }
              type: { type: string }
              payload: { type: object, additionalProperties: true }
              created_at: { type: string, format: date-time }
    MemorySearchHit:
      type: object
      required: [id, kind, text, source, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [message, memory, summary] }
        text: { type: string }
        source: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        store_type: { type: [string, "null"] }
        store_id: { type: [string, "null"] }
        state: { type: [string, "null"], enum: [active, stale, archived, pinned, null] }
    SkillIndexItem:
      type: object
      required: [id, workspace_id, agent_id, name, description, revision, state, hits, last_hit_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        description: { type: string, maxLength: 60 }
        revision: { type: integer, minimum: 0 }
        version_id: { type: string, description: 当前任务绑定版本 }
        state: { type: string, enum: [active, stale, archived, pinned] }
        hits: { type: integer, minimum: 0 }
        last_hit_at: { type: [string, "null"], format: date-time }
    SkillCreateRequest:
      type: object
      additionalProperties: false
      required: [change_id, expected_revision, workspace_id, agent_id, name, description, text, basis]
      properties:
        change_id: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { type: integer, const: 0 }
        workspace_id: { type: string, minLength: 1 }
        agent_id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 60 }
        text: { type: string, minLength: 1 }
        basis: { type: string, minLength: 1 }
        conversation_id: { type: [string, "null"] }
        files: { type: object, additionalProperties: { type: string } }
    GovernanceChangeRequest:
      type: object
      required: [change_id, expected_revision]
      properties:
        change_id: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { type: integer, minimum: 0 }
    Identity:
      type: object
      required: [credential_owner_id, effective_user_id, name, org_id, role, demo, workspace_ids]
      properties:
        credential_owner_id: { type: string }
        effective_user_id: { type: string }
        name: { type: string }
        org_id: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        demo: { type: boolean }
        workspace_ids: { type: array, items: { type: string } }
        organization_status: { type: string, enum: [active, disabled, archived] }
    DemoIdentityRequest:
      type: object
      additionalProperties: false
      required: [user_id, change_id]
      properties:
        user_id: { type: string, minLength: 1 }
        change_id: { type: string, minLength: 1, maxLength: 128 }
    GovernanceResource:
      type: object
      required: [id, name, status, revision, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        org_id: { type: string }
        workspace_id: { type: string }
        data_dir: { type: string, description: 服务分配的工作区目录 }
        status: { type: string, enum: [active, disabled, archived] }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        description: { type: string, maxLength: 60 }
        source: { type: string, enum: [user, agent, system] }
        current_version_id: { type: [string, "null"] }
        type: { type: string, enum: [http, mcp] }
        config: { $ref: "#/components/schemas/ConnectorConfig" }
        credential_configured: { type: boolean }
    WorkspaceRequest:
      allOf:
        - { $ref: "#/components/schemas/GovernanceChangeRequest" }
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 80 }
            status: { type: string, enum: [active, disabled, archived] }
    AgentSpec:
      type: object
      additionalProperties: false
      required: [position, model_slot, skill_ids, connector_ids]
      properties:
        position: { type: string, minLength: 1, maxLength: 2000 }
        model_slot: { type: string, enum: [main, aux] }
        skill_ids: { type: array, uniqueItems: true, items: { type: string } }
        connector_ids: { type: array, uniqueItems: true, items: { type: string } }
    AgentRequest:
      allOf:
        - { $ref: "#/components/schemas/GovernanceChangeRequest" }
        - type: object
          required: [workspace_id, name, spec]
          properties:
            workspace_id: { type: string }
            name: { type: string, minLength: 1, maxLength: 80 }
            status: { type: string, enum: [active, disabled, archived] }
            spec: { $ref: "#/components/schemas/AgentSpec" }
    GovernanceResourcePatch:
      allOf:
        - { $ref: "#/components/schemas/GovernanceChangeRequest" }
        - type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 80 }
            status: { type: string, enum: [active, disabled, archived] }
            spec: { $ref: "#/components/schemas/AgentSpec" }
            description: { type: string, maxLength: 60 }
            config: { $ref: "#/components/schemas/ConnectorConfig" }
            credential: { type: [string, "null"], writeOnly: true, description: 服务端绑定认证信息；null清除，缺省不变 }
    Membership:
      type: object
      required: [id, org_id, user_id, name, role, status, revision, workspace_ids]
      properties:
        id: { type: string }
        org_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [active, disabled] }
        revision: { type: integer, minimum: 1 }
        workspace_ids: { type: array, items: { type: string } }
        workspace_access:
          type: array
          items:
            type: object
            required: [workspace_id, enabled, revision]
            properties:
              workspace_id: { type: string }
              enabled: { type: boolean }
              revision: { type: integer, minimum: 1 }
    MembershipRoleRequest:
      allOf:
        - { $ref: "#/components/schemas/GovernanceChangeRequest" }
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [owner, admin, member] }
            status: { type: string, enum: [active, disabled] }
    WorkspaceMemberRequest:
      allOf:
        - { $ref: "#/components/schemas/GovernanceChangeRequest" }
        - type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
    GovernanceSkillCreate:
      allOf:
        - { $ref: "#/components/schemas/SkillCreateRequest" }
    SkillVersionRequest:
      allOf:
        - { $ref: "#/components/schemas/MemoryChangeRequest" }
        - type: object
          properties:
            restore_version_id: { type: string, description: 恢复该版本正文与支撑文件，追加新版本；不能与text/files/name/description同时提供 }
    SkillVersion:
      type: object
      required: [id, skill_id, version_no, change_id, ledger_id, content, metadata, files, sha256, created_by, created_at]
      properties:
        id: { type: string }
        skill_id: { type: string }
        version_no: { type: integer, minimum: 1 }
        change_id: { type: string }
        ledger_id: { type: integer }
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        files: { type: array, items: { $ref: "#/components/schemas/MemoryLedgerFile" } }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    ConnectorToolPolicy:
      type: object
      additionalProperties: false
      required: [read_only, destructive, risk_level, needs_approval]
      properties:
        read_only: { type: boolean }
        destructive: { type: boolean }
        risk_level: { type: string, enum: [low, medium, high] }
        needs_approval: { type: boolean }
        timeout_ms: { type: integer, minimum: 1, maximum: 300000, default: 60000 }
    ConnectorConfig:
      type: object
      additionalProperties: false
      required: [allowed_hosts, allowed_ports, allow_loopback]
      properties:
        url: { type: string, format: uri }
        allowed_hosts: { type: array, uniqueItems: true, items: { type: string, minLength: 1 } }
        allowed_ports: { type: array, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 65535 } }
        allow_loopback: { type: boolean, default: false }
        transport: { type: string, enum: [stdio, streamable_http] }
        command: { type: string, description: stdio 固定管理员批准的可执行路径 }
        args: { type: array, items: { type: string } }
        startup_files: { type: array, maxItems: 20, items: { type: string }, description: stdio明确登记的绝对代码文件；规范化目标与SHA绑定配置修订，变更需要提交新修订 }
        credential_header: { type: string, default: Authorization }
        tool_policies: { type: object, additionalProperties: { $ref: "#/components/schemas/ConnectorToolPolicy" } }
        idempotent_endpoints:
          type: array
          items:
            type: object
            required: [method, path, guarantee]
            properties:
              method: { type: string, enum: [POST, PUT, PATCH, DELETE] }
              path: { type: string }
              guarantee: { type: string, minLength: 1, description: 上游真实去重承诺及验证依据 }
    ConnectorRequest:
      allOf:
        - { $ref: "#/components/schemas/GovernanceChangeRequest" }
        - type: object
          required: [workspace_id, name, type, config]
          properties:
            workspace_id: { type: string }
            name: { type: string, minLength: 1, maxLength: 80 }
            type: { type: string, enum: [http, mcp] }
            config: { $ref: "#/components/schemas/ConnectorConfig" }
            credential: { type: string, writeOnly: true }
    GrantRequest:
      type: object
      additionalProperties: false
      required: [change_id, resource_type, resource_id, grantee_type, grantee_id]
      properties:
        change_id: { type: string, minLength: 1, maxLength: 128 }
        resource_type: { type: string, enum: [skill, connector, agent] }
        resource_id: { type: string }
        grantee_type: { type: string, enum: [agent, user] }
        grantee_id: { type: string }
    Grant:
      type: object
      required: [id, change_id, resource_type, resource_id, grantee_type, grantee_id, workspace_id, revision, granted_by_user_id, created_at, revoked_at]
      properties:
        id: { type: string }
        change_id: { type: string }
        resource_type: { type: string, enum: [skill, connector, agent] }
        resource_id: { type: string }
        grantee_type: { type: string, enum: [agent, user] }
        grantee_id: { type: string }
        workspace_id: { type: string }
        revision: { type: integer, minimum: 1 }
        granted_by_user_id: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    PermissionRuleRequest:
      type: object
      additionalProperties: false
      required: [change_id, tool_name, pattern, effect]
      properties:
        change_id: { type: string, minLength: 1, maxLength: 128 }
        tool_name: { type: string }
        pattern: { type: string, minLength: 1, description: 路径为规范化目录；bash为完整命令；HTTP为连接器约束内域名 }
        effect: { type: string, enum: [allow, deny] }
    PermissionRule:
      type: object
      required: [id, agent_id, tool_name, pattern, effect, revision, created_by_user_id, created_at, revoked_at, change_id]
      properties:
        id: { type: string }
        agent_id: { type: string }
        tool_name: { type: string }
        pattern: { type: string }
        effect: { type: string, enum: [allow, deny] }
        revision: { type: integer, minimum: 1 }
        created_by_user_id: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        change_id: { type: [string, "null"], description: 导入的历史规则允许没有change_id }
    AuditRecord:
      type: object
      required: [seq, ts, actor_type, actor_id, action, resource_type, resource_id, detail, prev_hash, hash]
      properties:
        seq: { type: integer, minimum: 1 }
        ts: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, agent, system, curator] }
        actor_id: { type: string }
        action: { type: string }
        resource_type: { type: [string, "null"] }
        resource_id: { type: [string, "null"] }
        detail: { type: object, additionalProperties: true, description: 已脱敏，包含真实及有效身份和范围 }
        prev_hash: { type: string }
        hash: { type: string }
    AuditVerification:
      type: object
      required: [ok, internal, anchor]
      properties:
        ok: { type: boolean }
        internal:
          type: object
          required: [ok, checked_rows, broken_at, reason]
          properties:
            ok: { type: boolean }
            checked_rows: { type: integer, minimum: 0 }
            broken_at: { type: [integer, "null"] }
            reason: { type: [string, "null"] }
        anchor:
          type: object
          required: [ok, status, seq, hash]
          properties:
            ok: { type: boolean }
            status: { type: string, enum: [verified, empty, missing, malformed, mismatch] }
            seq: { type: [integer, "null"] }
            hash: { type: [string, "null"] }
    DiagnosticBackup:
      type: object
      required: [id, kind, created_at, verified, database_sha256, anchor_seq, anchor_hash]
      properties:
        id: { type: string }
        kind: { type: string, enum: [database, directory] }
        created_at: { type: string, format: date-time }
        verified: { type: boolean }
        database_sha256: { type: string }
        anchor_seq: { type: integer }
        anchor_hash: { type: string }
  parameters:
    GovernanceId: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    GovernanceWorkspace: { name: workspace_id, in: query, schema: { type: string, minLength: 1 } }
    GovernanceLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    GovernanceAfter: { name: after, in: query, schema: { type: string, minLength: 1 }, description: 排他游标绑定有效身份、范围、过滤及稳定排序 }
    DemoIdentity: { name: X-AgentCrew-Identity, in: header, schema: { type: string, minLength: 1 }, description: 服务端签发标识，未知或失效返回401；缺省使用真实owner }
    MemoryStoreType: { name: store_type, in: path, required: true, schema: { type: string, enum: [user, workspace, soul, skill] } }
    MemoryStoreId: { name: store_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    MemoryLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    MemoryAfter: { name: after, in: query, schema: { type: string, minLength: 1 }, description: 排他游标，绑定相同身份、范围、过滤及排序；不匹配返回422 }
    MemoryWorkspace: { name: workspace_id, in: query, required: true, schema: { type: string, minLength: 1 } }
    MemoryAgent: { name: agent_id, in: query, required: true, schema: { type: string, minLength: 1 } }
  responses:
    GovernanceResourceEnvelope:
      description: 真实资源及修订，凭据只返回configured状态
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/GovernanceResource" }
    GovernanceResourcePage:
      description: 当前身份可见资源的稳定分页
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [items, next_after]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GovernanceResource" } }
                  next_after: { type: [string, "null"] }
    MemoryChangeEnvelope:
      description: 已提交完整变更，重试返回首次提交标识
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/MemoryChange" }
    MemoryJobEnvelope:
      description: 真实后台作业及状态
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/MemoryJob" }
    ErrEnvelope:
      description: 错误信封
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

x-memory-error-responses: &memory_errors
  "401": { $ref: "#/components/responses/ErrEnvelope" }
  "403": { $ref: "#/components/responses/ErrEnvelope" }
  "404": { $ref: "#/components/responses/ErrEnvelope" }
  "409": { $ref: "#/components/responses/ErrEnvelope" }
  "422": { $ref: "#/components/responses/ErrEnvelope" }
  "500": { $ref: "#/components/responses/ErrEnvelope" }
  "503": { $ref: "#/components/responses/ErrEnvelope" }

paths:
  /api/identity:
    get:
      operationId: readIdentity
      tags: [governance]
      x-implementation-card: M2-03
      x-domain-card: M2-03
      responses:
        <<: *memory_errors
        "200":
          description: 请求固定的有效身份及当前角色
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Identity" }
