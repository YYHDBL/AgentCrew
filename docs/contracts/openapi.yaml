# AgentCrew Sidecar API（v0.3-draft——第四轮审查回稿：M0 操作具备可执行 schema）
# 维护：后端 Agent。x-phase 标注实现批次（m0 = 当前切片；p3/p4/p5 = 增量池）。
# 鉴权：除 /api/health 外全部 Bearer（AGENTCREW_TOKEN 环境变量注入，不经 stdout）。
# 信封：成功 JSON = {"data": ...}；错误 = {"error": {code, message, detail}}；
#       204 与 SSE 流不套信封。游标（from/after_seq）一律排他：返回 seq > 游标。
# SSE 帧：默认帧 = 事件信封 {global_seq, task_run_id?, seq?, type, payload, ts}；
#         控制帧 event:resync（data 含最后连续 global_seq，客户端从该游标重连）；
#         event:shutdown（优雅关闭，客户端保存游标）；event:ping 心跳。
openapi: 3.1.0
info:
  title: AgentCrew Sidecar API
  version: 0.4.0-draft
  description: |
    单用户本地 sidecar。M0 操作带完整请求/响应/错误 schema；
    p3/p5 操作 schema 随对应切片细化（当前为方向性描述）。
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port: { default: "8710" }
security:
  - bearerToken: []
tags:
  - { name: tasks, description: 任务（会话）与指令 }
  - { name: materials, description: 任务材料与访问范围（F001） }
  - { name: queue, description: 排队：暂停/继续/取消（F006） }
  - { name: approvals, description: 审批（F005） }
  - { name: questions, description: 向用户提问的回答链（v0.3 新增） }
  - { name: verifications, description: 待核验结果提交（F003） }
  - { name: artifacts, description: 产物（F004） }
  - { name: runs, description: 执行记录与事件（F002/F008） }
  - { name: settings, description: 后端运行配置 }
  - { name: memory, description: 三库、Skill、审核、账本与后台作业（M1-11 实施） }
  - { name: cron, description: 定时任务（F007，phase p5） }

components:
  securitySchemes:
    bearerToken: { type: http, scheme: bearer }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            detail: { type: object, additionalProperties: true }
    ConversationSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, "null"] }
        status: { type: string, enum: [active, archived] }
        agent_name: { type: string }
        last_activity_at: { type: string, format: date-time }
        state_badge: { type: string, enum: [idle, running, waiting_approval, waiting_question, interrupted, failed] }
    TaskRunSummary:
      type: object
      properties:
        id: { type: string }
        instruction: { type: string }
        status: { type: string, enum: [queued, running, waiting_user, waiting_verification, interrupted, completed, failed, cancelled] }
        current_attempt_no: { type: integer }
        cron_job_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ConversationState:
      type: object
      properties:
        state: { type: string, enum: [idle, starting, running, error] }
        waiting_approvals: { type: integer }
        waiting_questions: { type: integer }
        queue_paused: { type: boolean }
        at_global_seq: { type: integer, description: 快照反映到的全局事件位置；≤它的 global_seq 已被吸收，续播跳过（v0.3） }
        queue:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              enqueued_at: { type: string, format: date-time }
        can_send: { type: boolean }
        can_queue: { type: boolean }
        can_cancel: { type: boolean }
        can_continue_queue: { type: boolean }
        current_task_run_id: { type: [string, "null"] }
    Scope:
      type: object
      properties:
        workspace_dir: { type: string }
        materials_dir: { type: string }
        folders:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              access: { type: string, enum: [read, read_write], description: v1.7 起授权界面读写分列 }
    MaterialImportResult:
      type: object
      properties:
        original_path: { type: string }
        stored_name: { type: string }
        size_bytes: { type: integer }
        error: { type: [string, "null"] }
    ConversationCreateRequest:
      type: object
      required: [instruction]
      properties:
        agent_id: { type: string }
        instruction: { type: string, minLength: 1 }
        client_request_id: { type: string, description: 幂等键——网络重试不产生重复任务（v0.3） }
        import_files: { type: array, items: { type: string }, maxItems: 20 }
        folders: { type: array, items: { type: string }, maxItems: 5 }
    ConversationCreateData:
      type: object
      properties:
        conversation: { $ref: "#/components/schemas/ConversationSummary" }
        materials: { type: array, items: { $ref: "#/components/schemas/MaterialImportResult" } }
        folders:
          type: array
          description: 授权文件夹逐项结果（不存在/超限逐项报 error；C7 落地补充）
          items:
            type: object
            properties:
              path: { type: string }
              error: { type: [string, "null"] }
        scope: { $ref: "#/components/schemas/Scope" }
        task_run_id: { type: string }
    ConversationPatchRequest:
      type: object
      properties:
        title: { type: string, minLength: 1 }
    InstructionRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        client_request_id: { type: string }
    Message:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        task_run_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    QueueCancelRequest:
      type: object
      properties:
        item_ids: { type: array, items: { type: string } }
        all: { type: boolean }
    Approval:
      type: object
      properties:
        call_id: { type: string }
        tool: { type: string }
        target: { type: string }
        input_hash: { type: string }
        risk: { type: string, enum: [low, medium, high] }
        always_scope_preview: { type: [string, "null"] }
        requested_at: { type: string, format: date-time }
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [allow_once, allow_always, reject_once, reject_always] }
        input_hash: { type: string, description: 可选——与审批卡绑定的参数哈希，不一致 409 APPROVAL_STALE（v0.3.1 补） }
    QuestionPending:
      type: object
      properties:
        request_id: { type: string }
        question: { type: string }
        options: { type: array, items: { type: string } }
        asked_at: { type: string, format: date-time }
    QuestionAnswerRequest:
      type: object
      properties:
        answer: { type: [string, "null"], description: 用户的回答；null = 用户取消回答（按"拒绝回答"告知模型） }
    PendingVerification:
      type: object
      properties:
        call_id: { type: string }
        tool: { type: string }
        input: { type: object, additionalProperties: true }
        dispatched_at: { type: string, format: date-time }
        evidence: { type: string }
    VerificationRequest:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string, enum: [confirmed_executed, confirmed_not_executed] }
        note: { type: string }
    Artifact:
      type: object
      properties:
        id: { type: string }
        task_run_id: { type: string }
        tool_call_id: { type: string }
        name: { type: string }
        path: { type: string }
        ext: { type: string }
        size_bytes: { type: [integer, "null"] }
        status: { type: string, enum: [generating, ready, failed, missing] }
        created_at: { type: string, format: date-time }
    Settings:
      type: object
      properties:
        config_version: { type: string }
        memory: { $ref: "#/components/schemas/MemorySettings" }
        models:
          type: object
          properties:
            main: { $ref: "#/components/schemas/ModelSlot" }
            aux: { $ref: "#/components/schemas/ModelSlot" }
        gates:
          type: object
          properties:
            max_steps: { type: integer }
            stall_seconds: { type: integer }
            repeat_limit: { type: integer }
            global_concurrency: { type: integer }
            token_budget: { type: integer, description: 任务累计 token 硬上限（超限 RUN_FAILED(token_budget)；压缩是 M1）——C8 }
        limits:
          type: object
          properties:
            max_files: { type: integer }
            max_file_mb: { type: integer }
            max_folders: { type: integer }
    ModelSlot:
      type: object
      properties:
        provider: { type: string, enum: [glm, openai-compatible], description: glm 使用 Anthropic Messages；openai-compatible 使用 Chat Completions }
        model: { type: string }
        context_window: { type: [integer, "null"], minimum: 1 }
        context_window_source: { type: [string, "null"] }
        tokenizer_repository: { type: [string, "null"] }
        tokenizer_revision: { type: [string, "null"] }
        tokenizer_sha256: { type: [string, "null"] }
        prompt_format: { type: [string, "null"] }
        max_tokens: { type: integer, minimum: 1 }
        api_key_configured: { type: boolean }
        api_key_hint: { type: string, description: 尾 4 位 }
        effective_source: { type: string, enum: [env, file], description: v1.1：该槽当前生效来源 }
    SettingsPatchRequest:
      type: object
      properties:
        models:
          type: object
          properties:
            main: { type: object, additionalProperties: true }
            aux: { type: object, additionalProperties: true }
        api_key_clear: { type: array, items: { type: string, enum: [main, aux] }, description: 显式清除某槽密钥 }
        gates: { type: object, additionalProperties: true }
        limits: { type: object, additionalProperties: true }
        memory: { $ref: "#/components/schemas/MemorySettings" }
    SettingsPatchData:
      type: object
      properties:
        settings: { $ref: "#/components/schemas/Settings" }
        ignored_fields: { type: array, items: { type: string }, description: 被环境变量覆盖而未生效的字段 }
        restart_required:
          type: array
          items: { type: string }
          description: 需重启生效的本次触碰字段（gates.global_concurrency 在进程启动期构造信号量，PATCH 仅落盘——C8 二轮回稿）
        audit:
          type: object
          description: 审计入链状态（外审回稿：一切配置变更入审计链）
          properties:
            status: { type: string, enum: [ok, pending, failed], description: pending = 审计写失败已落待办文件待补链；failed = 待办也无法落盘 }
    MemorySettings:
      type: object
      additionalProperties: false
      properties:
        user_quota: { type: integer, minimum: 1, default: 1400 }
        workspace_quota: { type: integer, minimum: 1, default: 2200 }
        soul_quota: { type: integer, minimum: 1, default: 2700 }
        write_approval: { type: boolean, default: false }
    MemorySource:
      type: object
      additionalProperties: false
      required: [actor_type, actor_id]
      properties:
        actor_type: { type: string, enum: [user, agent, curator, system] }
        actor_id: { type: string, minLength: 1 }
        conversation_id: { type: [string, "null"] }
        task_run_id: { type: [string, "null"] }
        job_id: { type: [string, "null"] }
        manual_edit_id: { type: [string, "null"] }
    MemoryEntry:
      type: object
      required: [entry_id, entry_hash, text, state, hits, last_hit_at, created_at, source, basis, needs_review]
      properties:
        entry_id: { type: string }
        entry_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        text: { type: string }
        state: { type: string, enum: [active, stale, archived, pinned] }
        hits: { type: integer, minimum: 0 }
        last_hit_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/MemorySource" }
        basis: { type: string, minLength: 1 }
        needs_review: { type: boolean }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
    MemoryStore:
      type: object
      required: [store_type, store_id, revision, text, sha256, metadata_sha256, used_characters, quota, entries, at_global_seq]
      properties:
        store_type: { type: string, enum: [user, workspace, soul, skill] }
        store_id: { type: string }
        workspace_id: { type: [string, "null"] }
        agent_id: { type: [string, "null"] }
        revision: { type: integer, minimum: 0 }
        text: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        metadata_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        used_characters: { type: integer, minimum: 0 }
        quota: { type: [integer, "null"], minimum: 1 }
        entries: { type: array, items: { $ref: "#/components/schemas/MemoryEntry" } }
        at_global_seq: { type: integer, minimum: 0 }
        files: { type: array, items: { type: string } }
        description: { type: string, maxLength: 60 }
        name: { type: string }
    MemoryChangeRequest:
      type: object
      additionalProperties: false
      required: [change_id, expected_revision, basis]
      properties:
        change_id: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { type: integer, minimum: 0 }
        text: { type: string, minLength: 1 }
        basis: { type: string, minLength: 1 }
        conversation_id: { type: [string, "null"] }
        description: { type: string, maxLength: 60 }
        name: { type: string, minLength: 1 }
        files: { type: object, additionalProperties: { type: [string, "null"] }, description: Skill 相对路径到正文，null 删除；服务校验目录边界 }
        review_decision: { type: string, enum: [approve, reject] }
    MemoryChange:
      type: object
      required: [change_id, ledger_id, revision, global_seq, idempotent_replay]
      properties:
        change_id: { type: string }
        ledger_id: { type: integer }
        revision: { type: integer, minimum: 1 }
        global_seq: { type: integer, minimum: 1 }
        entry_id: { type: [string, "null"] }
        entry_hash: { type: [string, "null"] }
        idempotent_replay: { type: boolean }
    MemoryWriteRequest:
      allOf:
        - { $ref: "#/components/schemas/MemoryChangeRequest" }
        - { required: [text] }
    MemoryReviewRequest:
      allOf:
        - { $ref: "#/components/schemas/MemoryChangeRequest" }
        - { required: [review_decision] }
    MemoryLedger:
      type: object
      required: [id, change_id, store_type, store_id, action, before_text, after_text, before_metadata, after_metadata, source, created_at]
      properties:
        id: { type: integer }
        change_id: { type: string }
        store_type: { type: string, enum: [user, workspace, soul, skill] }
        store_id: { type: string }
        action: { type: string, enum: [create, update, archive, restore, pin, unpin, review, rollback, batch] }
        before_text: { type: [string, "null"] }
        after_text: { type: [string, "null"] }
        before_metadata: { type: object, additionalProperties: true }
        after_metadata: { type: object, additionalProperties: true }
        before_files: { type: array, items: { $ref: "#/components/schemas/MemoryLedgerFile" } }
        after_files: { type: array, items: { $ref: "#/components/schemas/MemoryLedgerFile" } }
        restored_ledger_id: { type: [integer, "null"] }
        source: { $ref: "#/components/schemas/MemorySource" }
        created_at: { type: string, format: date-time }
    MemoryLedgerFile:
      type: object
      required: [path, content, sha256]
      properties:
        path: { type: string }
        content: { type: [string, "null"] }
        sha256: { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
    MemoryJob:
      type: object
      required: [id, kind, status, conversation_id, task_run_id, trigger_global_seq, model, config_version, usage, error, created_at, finished_at, approvals]
      properties:
        id: { type: string }
        kind: { type: string, enum: [summary, memory_review, skill_review, curate] }
        status: { type: string, enum: [queued, running, waiting_approval, completed, cancelled, interrupted, failed] }
        conversation_id: { type: [string, "null"] }
        task_run_id: { type: [string, "null"] }
        trigger_global_seq: { type: integer, minimum: 0 }
        model: { type: [string, "null"] }
        config_version: { type: string }
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }
        report: { type: [object, "null"], additionalProperties: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        approvals:
          type: array
          items:
            type: object
            required: [id, job_id, call_id, input_hash, tool, input, status]
            properties:
              id: { type: string }
              job_id: { type: string }
              call_id: { type: string }
              input_hash: { type: string }
              tool: { type: string, enum: [memory_write, skill_patch] }
              input: { type: object, additionalProperties: true }
              status: { type: string, enum: [pending, allowed, rejected, expired] }
    MemorySearchHit:
      type: object
      required: [id, kind, text, source, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [message, memory, summary] }
        text: { type: string }
        source: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        store_type: { type: [string, "null"] }
        store_id: { type: [string, "null"] }
        state: { type: [string, "null"], enum: [active, stale, archived, pinned, null] }
    SkillIndexItem:
      type: object
      required: [id, workspace_id, agent_id, name, description, revision, state, hits, last_hit_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        description: { type: string, maxLength: 60 }
        revision: { type: integer, minimum: 0 }
        state: { type: string, enum: [active, stale, archived, pinned] }
        hits: { type: integer, minimum: 0 }
        last_hit_at: { type: [string, "null"], format: date-time }
    SkillCreateRequest:
      type: object
      additionalProperties: false
      required: [change_id, expected_revision, workspace_id, agent_id, name, description, text, basis]
      properties:
        change_id: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { type: integer, const: 0 }
        workspace_id: { type: string, minLength: 1 }
        agent_id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 60 }
        text: { type: string, minLength: 1 }
        basis: { type: string, minLength: 1 }
        conversation_id: { type: [string, "null"] }
        files: { type: object, additionalProperties: { type: string } }
  parameters:
    MemoryStoreType: { name: store_type, in: path, required: true, schema: { type: string, enum: [user, workspace, soul, skill] } }
    MemoryStoreId: { name: store_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    MemoryLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    MemoryAfter: { name: after, in: query, schema: { type: string, minLength: 1 }, description: 排他游标，绑定相同身份、范围、过滤及排序；不匹配返回422 }
    MemoryWorkspace: { name: workspace_id, in: query, required: true, schema: { type: string, minLength: 1 } }
    MemoryAgent: { name: agent_id, in: query, required: true, schema: { type: string, minLength: 1 } }
  responses:
    MemoryChangeEnvelope:
      description: 已提交完整变更，重试返回首次提交标识
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/MemoryChange" }
    MemoryJobEnvelope:
      description: 真实后台作业及状态
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/MemoryJob" }
    ErrEnvelope:
      description: 错误信封
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

x-memory-error-responses: &memory_errors
  "401": { $ref: "#/components/responses/ErrEnvelope" }
  "403": { $ref: "#/components/responses/ErrEnvelope" }
  "404": { $ref: "#/components/responses/ErrEnvelope" }
  "409": { $ref: "#/components/responses/ErrEnvelope" }
  "422": { $ref: "#/components/responses/ErrEnvelope" }
  "500": { $ref: "#/components/responses/ErrEnvelope" }
  "503": { $ref: "#/components/responses/ErrEnvelope" }

paths:
  /api/health:
    get:
      tags: [tasks]
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
  /api/diagnostics:
    get:
      tags: [settings]
      summary: 诊断入口（迁移失败/审计链断裂 → 只读诊断模式，backend-service §1）
      responses:
        "200":
          description: 正常模式返回 mode=normal；诊断模式含原因与恢复提示
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mode: { type: string, enum: [normal, diagnostic] }
                      reason: { type: string }
                      hint: { type: string }
  /api/limits:
    get:
      tags: [materials]
      responses:
        "200":
          description: 材料与导入限制
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      max_files: { type: integer }
                      max_file_mb: { type: integer }
                      max_folders: { type: integer }
  /api/conversations:
    get:
      tags: [tasks]
      summary: 任务列表
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationSummary" }
    post:
      tags: [tasks, materials]
      summary: 发送首条指令并创建任务（F001）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationCreateRequest" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
